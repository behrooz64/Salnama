<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#8b5a2b"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><title>تقویم موچه ترکمنی</title>
</head>
<body>
<main class="app">
<header><div class="logo">🐾</div><div><h1>تقویم موچه ترکمنی</h1><p>محاسبه سن براساس موچه ترکمنی</p></div></header>
<button id="installBtn" class="install-btn">نصب برنامه 📲</button>
<section class="card">
<h2>۱- انتخاب سال مرجع</h2>
<select id="referenceYear"></select>
<p id="referenceAnimal"></p>
</section>
<section class="card">
<h2>۲- انتخاب حیوان تولد</h2>
<div id="animals" class="grid"></div>
</section>
<section class="card hero">
<div id="result" class="result"><div class="animal">🐾</div><h2>نتیجه</h2><p>ابتدا حیوان را انتخاب کنید</p></div>
</section>
<footer>تقویم موچه ترکمنی</footer>
</main>
<script src="animalData.js"></script><script src="app.js"></script>
<script>
let deferredPrompt;
const installBtn=document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBtn.style.display='block';});
installBtn.onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();deferredPrompt=null;installBtn.style.display='none';}};
if('serviceWorker' in navigator){navigator.serviceWorker.register('service-worker.js').then(reg=>reg.update());}
</script>
</body></html>
